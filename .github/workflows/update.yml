name: Update AUR packages

# Checks upstream gcx for a new release once a day (and on demand). When one is
# found, the release-tracking packages (gcx, gcx-bin) are bumped and verified by
# building them in a clean Arch container via Dagger; the VCS package (gcx-git)
# is build-checked so breakage is caught early. Anything that changed is then
# committed to this repo and pushed to its AUR package.

on:
  schedule:
    - cron: '17 4 * * *' # daily at 04:17 UTC
  workflow_dispatch:

concurrency:
  group: aur-update
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Keep this in sync with engineVersion in dagger.json. `dagger develop`
  # reconciles the module to whichever CLI version is installed here.
  DAGGER_VERSION: v0.21.0

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION="${DAGGER_VERSION}" BIN_DIR=/usr/local/bin sudo -E sh
          dagger version

      - name: Check Dagger version pin
        # dagger.json engineVersion and the DAGGER_VERSION env must match —
        # otherwise `dagger develop` silently reconciles the module and CI
        # runs a different engine than a local checkout.
        run: |
          pinned="$(jq -r .engineVersion dagger.json)"
          if [[ "${pinned}" != "${DAGGER_VERSION}" ]]; then
            echo "::error title=dagger::dagger.json engineVersion (${pinned}) != DAGGER_VERSION (${DAGGER_VERSION})"
            exit 1
          fi
          echo "Dagger pin in sync: ${pinned}"

      - name: Generate module bindings
        run: dagger develop

      - name: Configure git identity
        # --global so the identity also applies to the throwaway AUR clones that
        # scripts/aur-sync.sh makes in temp dirs (a repo-local config would only
        # cover this workspace, and the AUR commits would fail with "empty ident
        # name"). It still covers the workspace commit below via the global fallback.
        run: |
          git config --global user.name  'thelooter'
          git config --global user.email 'evekolb2204@gmail.com'

      - name: Update release-tracking packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Each package is updated independently: a failed verification build
          # for one must not block committing/publishing the other. So this
          # step always exits 0 and records failures in the environment for a
          # final gate step after the commit/publish stages.
          failed_pkgs=""
          for pkg in gcx gcx-bin; do
            echo "::group::update ${pkg}"
            if dagger call update \
                 --src=. --pkg="${pkg}" --token=env:GH_TOKEN \
                 export --path="./${pkg}"; then
              echo "${pkg}: ok"
            else
              echo "::error title=${pkg}::update/verification build failed"
              failed_pkgs="${failed_pkgs} ${pkg}"
            fi
            echo "::endgroup::"
          done
          if [[ -n "${failed_pkgs}" ]]; then
            echo "UPDATE_FAILED_PKGS=${failed_pkgs}" >> "${GITHUB_ENV}"
            echo "::warning title=update::packages failed:${failed_pkgs} — continuing so successful bumps can still be committed"
          fi

      - name: Build-check the VCS package
        run: |
          echo "::group::build gcx-git"
          # A broken -git build must not block publishing successful release
          # bumps either, so record the failure and keep going.
          if ! dagger call build --src=. --pkg=gcx-git; then
            echo "::error title=gcx-git::build-check failed"
            echo "GIT_CHECK_FAILED=1" >> "${GITHUB_ENV}"
          fi
          echo "::endgroup::"

      - name: Commit version bumps
        run: |
          git add gcx gcx-bin gcx-git
          if git diff --cached --quiet; then
            echo "No package changes to commit."
          else
            git commit -m "ci: update gcx packages to latest upstream"
            git push
          fi

      # AUR publishing is opt-in: it only runs once you set the repository
      # variable AUR_PUBLISH to "true" (Settings → Secrets and variables →
      # Actions → Variables). Until then CI keeps this repo up to date but never
      # pushes to the AUR — so pushing to GitHub can't publish anything.
      - name: Set up AUR SSH
        if: vars.AUR_PUBLISH == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          install -dm700 ~/.ssh
          printf '%s\n' "${AUR_SSH_KEY}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          cat >> ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF

      - name: Push to the AUR
        if: vars.AUR_PUBLISH == 'true'
        run: scripts/aur-sync.sh gcx gcx-bin gcx-git

      - name: AUR publishing disabled (notice)
        if: vars.AUR_PUBLISH != 'true'
        run: |
          echo "::notice title=AUR::Skipped AUR push — set repository variable AUR_PUBLISH=true to enable."

      # Fail the run *after* successful bumps have been committed/published,
      # so one broken package never silences the failure, but never blocks
      # the healthy package either.
      - name: Report package failures
        if: always()
        run: |
          failed=0
          if [[ -n "${UPDATE_FAILED_PKGS:-}" ]]; then
            echo "::error title=update::packages failed:${UPDATE_FAILED_PKGS}"
            failed=1
          fi
          if [[ -n "${GIT_CHECK_FAILED:-}" ]]; then
            echo "::error title=gcx-git::build-check failed"
            failed=1
          fi
          exit "${failed}"
