name: Update AUR packages

# Checks upstream gcx for a new release once a day (and on demand). The two
# release-tracking packages (gcx, gcx-bin) update in parallel matrix legs,
# each verified by building in a clean Arch container via Dagger; the VCS
# package (gcx-git) is build-checked so breakage surfaces early. A combine job
# then commits whatever changed and pushes each package to its AUR repository.
#
# Design: orchestration lives in the Dagger module (.dagger/main.go) — version
# parsing, bumping, verification builds, commit-message formatting. This file
# stays thin on purpose: checkout, toolchain, secrets, artifact passing, and
# git push. Failure state travels through native job results (matrix legs and
# the needs context), not shell variables.

on:
  schedule:
    - cron: '17 4 * * *' # daily at 04:17 UTC
  workflow_dispatch:

concurrency:
  group: aur-update
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Keep this in sync with engineVersion in dagger.json. `dagger develop`
  # reconciles the module to whichever CLI version is installed here.
  DAGGER_VERSION: v0.21.9

jobs:
  update:
    # One leg per release-tracking package. fail-fast: false so a broken gcx
    # never blocks a healthy gcx-bin (or vice versa) — the publish job commits
    # whatever legs succeeded and the final gate reports the rest.
    strategy:
      fail-fast: false
      matrix:
        pkg: [gcx, gcx-bin]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Dagger CLI
        # Install-only: with no call/verb inputs the action just installs the
        # pinned CLI to PATH. Version comes from DAGGER_VERSION so the pin
        # check below still guards a single source of truth.
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Check Dagger version pin
        # dagger.json engineVersion and DAGGER_VERSION must match — otherwise
        # `dagger develop` silently reconciles the module and CI runs a
        # different engine than a local checkout.
        run: |
          pinned="$(jq -r .engineVersion dagger.json)"
          if [[ "${pinned}" != "${DAGGER_VERSION}" ]]; then
            echo "::error title=dagger::dagger.json engineVersion (${pinned}) != DAGGER_VERSION (${DAGGER_VERSION})"
            exit 1
          fi

      - name: Generate module bindings
        run: dagger develop

      - name: Update ${{ matrix.pkg }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `update` bumps, verifies the bump builds, and returns the package
        # directory unchanged when already current — exporting is always safe.
        run: |
          dagger call update \
            --src=. --pkg="${{ matrix.pkg }}" --token=env:GH_TOKEN \
            export --path="./out"

      - name: Upload updated package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: out/
          if-no-files-found: error

  git-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Dagger CLI
        # Install-only: with no call/verb inputs the action just installs the
        # pinned CLI to PATH. Version comes from DAGGER_VERSION so the pin
        # check below still guards a single source of truth.
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Check Dagger version pin
        run: |
          pinned="$(jq -r .engineVersion dagger.json)"
          if [[ "${pinned}" != "${DAGGER_VERSION}" ]]; then
            echo "::error title=dagger::dagger.json engineVersion (${pinned}) != DAGGER_VERSION (${DAGGER_VERSION})"
            exit 1
          fi

      - name: Generate module bindings
        run: dagger develop

      - name: Build-check gcx-git
        run: dagger call build --src=. --pkg=gcx-git

  publish:
    needs: [update, git-check]
    # Run even when a leg failed so successful bumps still get published; the
    # final gate step reports the failures afterwards.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dagger CLI
        # Needed for the commit-message call below. Install-only: with no
        # call/verb inputs the action just installs the pinned CLI to PATH.
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      - name: Generate module bindings
        run: dagger develop

      - name: Download updated packages
        # A missing artifact means that leg failed — it must not stop the
        # packages that did succeed from being committed.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: '{gcx,gcx-bin}'
          path: ./

      - name: Configure git identity
        # --global so the identity also applies to the throwaway AUR clones that
        # scripts/aur-sync.sh makes in temp dirs (a repo-local config would only
        # cover this workspace, and the AUR commits would fail with "empty ident
        # name"). It still covers the workspace commit below via the global fallback.
        run: |
          git config --global user.name  'thelooter'
          git config --global user.email 'evekolb2204@gmail.com'

      - name: Commit version bumps
        run: |
          git add gcx gcx-bin
          if git diff --cached --quiet; then
            echo "No package changes to commit."
            exit 0
          fi
          changed="$(for p in gcx gcx-bin; do git diff --cached --quiet -- "$p" || printf '%s,' "$p"; done)"
          # Parsing and formatting live in the Dagger module — this shell only
          # detects *which* packages changed, which is inherently git state.
          msg="$(dagger call commit-message --src=. --pkgs="${changed%,}")"
          echo "Committing: ${msg}"
          git commit -m "${msg}"
          git push

      # AUR publishing is opt-in: it only runs once you set the repository
      # variable AUR_PUBLISH to "true" (Settings → Secrets and variables →
      # Actions → Variables). Until then CI keeps this repo up to date but never
      # pushes to the AUR — so pushing to GitHub can't publish anything.
      - name: Set up AUR SSH
        if: vars.AUR_PUBLISH == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          install -dm700 ~/.ssh
          printf '%s\n' "${AUR_SSH_KEY}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          cat >> ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF

      - name: Push to the AUR
        if: vars.AUR_PUBLISH == 'true'
        run: scripts/aur-sync.sh gcx gcx-bin gcx-git

      - name: AUR publishing disabled (notice)
        if: vars.AUR_PUBLISH != 'true'
        run: |
          echo "::notice title=AUR::Skipped AUR push — set repository variable AUR_PUBLISH=true to enable."

      # Fail the run *after* successful bumps have been committed/published,
      # so one broken package never silences the failure, but never blocks
      # the healthy package either.
      - name: Report package failures
        if: always()
        run: |
          failed=0
          if [[ "${{ needs.update.result }}" != 'success' ]]; then
            echo "::error title=update::release-package update failed (see the update legs)"
            failed=1
          fi
          if [[ "${{ needs.git-check.result }}" != 'success' ]]; then
            echo "::error title=gcx-git::build-check failed"
            failed=1
          fi
          exit "${failed}"
